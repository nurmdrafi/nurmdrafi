  <line x1="80" y1="428" x2="1120" y2="428" stroke="#D1D9E0" stroke-width="1"/>
  <text x="80" y="458" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#59636E">Also building pi-native — a performance-focused Pi coding-agent harness · native Rust tools · fail-closed permission gates</text>
