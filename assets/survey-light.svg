<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="ct cd">
  <title id="ct">Engineering survey sheet - Nur Mohamod Rafi</title>
  <desc id="cd">Cartographic survey sheet: graticule over cream paper, faint contours, survey points for each project with the Barikoi point marked live in red, a title block, scale bar, and Dhaka coordinates.</desc>

  <rect width="1200" height="500" fill="#F7F3E8"/>

