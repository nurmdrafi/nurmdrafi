    <path d="M 20 80 H 1180 M 20 160 H 1180 M 20 240 H 1180 M 20 320 H 1180 M 20 400 H 1180"/>
  </g>
  <g stroke="#C9BB98" stroke-width="1">
    <path d="M 640 20 V 480"/>
    <path d="M 20 240 H 1180"/>
  </g>

  <!-- contours -->
  <g fill="none" stroke="#C4B48B" stroke-width="1.2">
