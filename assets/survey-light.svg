    <path d="M 275 300 C 260 275, 300 245, 335 258 C 370 272, 372 308, 340 326 C 308 342, 285 325, 275 300 Z"/>
    <path d="M 880 150 C 860 120, 910 90, 960 105 C 1010 122, 1015 165, 975 185 C 935 202, 895 180, 880 150 Z"/>
