    <text x="776" y="416" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#6E6550">SHEET 1 OF 1 · DHAKA 23.81° N 90.41° E</text>
    <text x="776" y="448" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#6E6550">SURVEYED NOV 2022 – PRESENT</text>
