    <rect x="120" y="452" width="40" height="5" fill="none" stroke="#2A2A24" stroke-width="1"/>
    <rect x="160" y="452" width="40" height="5" fill="#2A2A24"/>
    <text x="80" y="446">0</text><text x="150" y="446">100</text><text x="196" y="446">200 KM</text>
