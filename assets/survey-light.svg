  <rect x="28" y="28" width="1144" height="444" fill="none" stroke="#2A2A24" stroke-width="0.8"/>

  <!-- graticule labels -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#8A7D5C">
    <text x="34" y="76">23°48' N</text>
    <text x="34" y="156">23°48' N</text>
    <text x="34" y="236">23°49' N</text>
    <text x="34" y="316">23°49' N</text>
    <text x="34" y="396">23°50' N</text>
    <text x="150" y="46">90°40' E</text>
    <text x="470" y="46">90°41' E</text>
    <text x="790" y="46">90°42' E</text>
    <text x="1090" y="46">90°43' E</text>
